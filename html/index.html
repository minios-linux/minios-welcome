<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>MiniOS</title>
  <script>
    (function () {
      var supported = ['de', 'en', 'es', 'fr', 'id', 'it', 'pt-BR', 'pt', 'ru'];
      var requested = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || 'en'];
      var target = 'en';

      function findLocale(locale) {
        var normalized = String(locale || '').replace(/_/g, '-').toLowerCase();
        var i;
        for (i = 0; i < supported.length; i += 1) {
          if (supported[i].toLowerCase() === normalized) return supported[i];
        }
        normalized = normalized.split('-')[0];
        for (i = 0; i < supported.length; i += 1) {
          if (supported[i].toLowerCase() === normalized) return supported[i];
        }
        return null;
      }

      for (var i = 0; i < requested.length; i += 1) {
        var match = findLocale(requested[i]);
        if (match) {
          target = match;
          break;
        }
      }
      window.location.replace('./locales/' + target + '.html' + window.location.search + window.location.hash);
    }());
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./locales/en.html"></noscript>
</head>
<body>
  <p><a href="./locales/en.html">MiniOS Welcome</a></p>
</body>
</html>
